name = "ai-gateway"
main = "worker.js"
compatibility_date = "2026-10-01"

[[kv_namespaces]]
binding = "KEYS"

[[durable_objects.bindings]]
name = "METER"
class_name = "Meter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Meter"]

[[durable_objects.bindings]]
name = "ADMIN"
class_name = "Admin"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Admin"]
