<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Key Router</title>
<style>
  :root { --bg: #f6f6f4; --card: #fff; --text: #1d1d1b; --muted: #6b6b66; --line: #e2e2dc; --accent: #2f5bea; --danger: #c43c2b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --card: #1f1f1d; --text: #ececE8; --muted: #9a9a93; --line: #33332f; --accent: #7d9bff; --danger: #ff7a68; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  input, select { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
  button { margin-top: 16px; padding: 9px 16px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  button.ghost { background: none; color: var(--danger); margin: 0; padding: 4px 8px; }
  button.ghost.plain { color: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); column-gap: 12px; }
  .tag { color: var(--danger); font-size: 12px; }
  button.copy { background: none; color: var(--accent); margin: 0 0 0 6px; padding: 0 4px; }
  .result { display: none; margin-top: 16px; padding: 12px; border-radius: 6px; border: 1px dashed var(--accent); }
  .row { display: flex; align-items: center; gap: 4px; margin: 4px 0; overflow-wrap: anywhere; }
  code { font: 13px ui-monospace, monospace; }
  pre { margin: 6px 0 0; padding: 10px; border-radius: 6px; background: var(--bg); overflow-x: auto; }
  .err { color: var(--danger); margin-top: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
  th { color: var(--muted); font-weight: 500; }
  .empty { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Key Router</h1>
  <p class="sub">Wrap a provider key in a disposable key that expires on its own.</p>

  <form class="card" id="create">
    <label for="base">Real endpoint (provider base URL)</label>
    <input id="base" placeholder="https://openrouter.ai/api/v1" required>
    <label for="key">Real API key</label>
    <input id="key" type="password" autocomplete="off" required>
    <div class="grid">
      <div>
        <label for="auth">Send real key as</label>
        <select id="auth">
          <option value="bearer">Authorization: Bearer</option>
          <option value="x-api-key">x-api-key (Anthropic)</option>
          <option value="api-key">api-key (Azure)</option>
          <option value="x-goog-api-key">x-goog-api-key (Gemini)</option>
        </select>
      </div>
      <div>
        <label for="expires">Expires</label>
        <input id="expires" type="datetime-local" required>
      </div>
      <div>
        <label for="label">Label (optional)</label>
        <input id="label" maxlength="100">
      </div>
      <div>
        <label for="cap">Spend cap, USD (optional)</label>
        <input id="cap" type="number" min="0" step="any">
      </div>
      <div>
        <label for="rpm">Requests per minute (optional)</label>
        <input id="rpm" type="number" min="1" step="1">
      </div>
    </div>
    <label for="models">Allowed models, comma separated, * at the end matches a prefix (optional)</label>
    <input id="models" placeholder="claude-sonnet-*, claude-haiku-*">
    <button>Create key</button>
    <div class="err" id="err"></div>
    <div class="result" id="result">
      <div class="row">Endpoint: <code id="outBase"></code><button type="button" class="copy" data-copy="outBase">copy</button></div>
      <div class="row">API key: <code id="outKey"></code><button type="button" class="copy" data-copy="outKey">copy</button></div>
      <div class="row">Claude Code <code>settings.json</code>:<button type="button" class="copy" data-copy="outSettings">copy</button></div>
      <pre><code id="outSettings"></code></pre>
    </div>
  </form>

  <div class="card">
    <table>
      <thead><tr><th>Key</th><th>Forwards to</th><th>Expires</th><th>Limits</th><th>Usage</th><th></th></tr></thead>
      <tbody id="list"></tbody>
    </table>
  </div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const endpoint = location.origin + "/v1";
  const pad = (n) => String(n).padStart(2, "0");
  const local = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  $("expires").value = local(new Date(Date.now() + 864e5));
  const hostAuth = { "api.anthropic.com": "x-api-key", "generativelanguage.googleapis.com": "x-goog-api-key" };
  $("base").oninput = () => {
    let host = "";
    try { host = new URL($("base").value.trim()).hostname; } catch {}
    const style = hostAuth[host] || (host.endsWith(".openai.azure.com") ? "api-key" : null);
    if (style) $("auth").value = style;
  };
  const cell = (text) => {
    const td = document.createElement("td");
    td.style.whiteSpace = "pre-line";
    td.textContent = text;
    return td;
  };
  const action = (text, cls, fn) => {
    const b = document.createElement("button");
    b.className = cls;
    b.textContent = text;
    b.onclick = fn;
    return b;
  };
  async function send(path, method, body) {
    const res = await fetch(path, { method, headers: { "content-type": "application/json" }, body: body && JSON.stringify(body) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error.message);
    return data;
  }

  async function load() {
    const keys = await (await fetch("/admin/keys")).json();
    $("list").innerHTML = "";
    if (!keys.length) $("list").innerHTML = '<tr><td colspan="6" class="empty">No keys</td></tr>';
    keys.sort((a, b) => Date.parse(b.expires) - Date.parse(a.expires));
    for (const k of keys) {
      const tr = document.createElement("tr");
      const active = Date.parse(k.expires) > Date.now();
      tr.append(cell((k.label ? k.label + "\n" : "") + k.id), cell(k.base));
      const exp = cell(new Date(k.expires).toLocaleString());
      if (!active) exp.append(Object.assign(document.createElement("div"), { className: "tag", textContent: "expired" }));
      tr.append(exp);
      tr.append(cell([
        k.auth && k.auth !== "bearer" ? "header " + k.auth : "",
        k.cap ? `cap $${k.cap}` : "",
        k.rpm ? `${k.rpm}/min` : "",
        k.models?.length ? k.models.join(", ") : "",
      ].filter(Boolean).join("\n") || "none"));
      const models = Object.entries(k.usage);
      const total = models.reduce((sum, [, u]) => sum + u.cost, 0);
      tr.append(cell(models.length
        ? `Total $${total.toFixed(4)}\n` + models.map(([m, u]) =>
            `${m}: ${u.priced ? "$" + u.cost.toFixed(4) : "unpriced"} (${u.requests} req, ${u.input} in / ${u.output} out)`).join("\n")
        : "none"));
      const td = document.createElement("td");
      if (active) td.append(action("Extend", "ghost plain", async () => {
        const v = prompt("New expiry (YYYY-MM-DDTHH:MM, local time)", local(new Date(Date.parse(k.expires) + 864e5)));
        if (!v) return;
        try { await send("/admin/keys/" + k.id, "PATCH", { expires: new Date(v).toISOString() }); } catch (e) { alert(e.message); }
        load();
      }));
      td.append(action(active ? "Revoke" : "Delete", "ghost", async () => {
        if (!confirm((active ? "Revoke " : "Delete ") + k.id + "?")) return;
        await fetch("/admin/keys/" + k.id, { method: "DELETE" });
        load();
      }));
      tr.append(td);
      $("list").append(tr);
    }
  }

  $("create").onsubmit = async (e) => {
    e.preventDefault();
    $("err").textContent = "";
    const num = (id) => ($(id).value === "" ? null : Number($(id).value));
    let data;
    try {
      data = await send("/admin/keys", "POST", {
        base: $("base").value.trim(),
        key: $("key").value.trim(),
        expires: new Date($("expires").value).toISOString(),
        auth: $("auth").value,
        label: $("label").value.trim(),
        cap: num("cap"),
        rpm: num("rpm"),
        models: $("models").value.split(",").map((m) => m.trim()).filter(Boolean),
      });
    } catch (err) {
      return ($("err").textContent = err.message);
    }
    $("outBase").textContent = endpoint;
    $("outKey").textContent = data.id;
    $("outSettings").textContent = JSON.stringify({
      env: { ANTHROPIC_API_KEY: data.id, ANTHROPIC_BASE_URL: location.origin, CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1" },
      permissions: { allow: [], deny: [] },
    }, null, 2);
    $("result").style.display = "block";
    $("key").value = "";
    load();
  };

  document.querySelectorAll("[data-copy]").forEach((b) => (b.onclick = async () => {
    await navigator.clipboard.writeText($(b.dataset.copy).textContent);
    b.textContent = "copied";
    setTimeout(() => (b.textContent = "copy"), 1200);
  }));
  load();
</script>
</body>
</html>
