<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Key Router sign-in</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f6f4; --card: #fff; --text: #1d1d1b; --muted: #6b6b66; --line: #e2e2dc; --accent: #2f5bea; --danger: #c43c2b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --card: #1f1f1d; --text: #ececE8; --muted: #9a9a93; --line: #33332f; --accent: #7d9bff; --danger: #ff7a68; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 4px; }
  input { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
  button { margin-top: 16px; padding: 9px 16px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  button.copy { background: none; color: var(--accent); margin: 0 0 0 6px; padding: 0 4px; }
  .err { color: var(--danger); margin-top: 12px; }
  .row { display: flex; align-items: baseline; gap: 4px; margin: 6px 0; }
  .row > span { white-space: nowrap; color: var(--muted); }
  .row code { overflow-wrap: anywhere; }
  code { font: 13px ui-monospace, monospace; }
  pre { margin: 6px 0 0; padding: 10px; border-radius: 6px; background: var(--bg); overflow-x: auto; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 16px 0 0; }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }
  .bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin-top: 4px; }
  .bar > div { height: 100%; background: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Key Router</h1>
  <p class="sub">Sign in to the admin page.</p>
  <div class="card">
    <button id="signin" style="margin: 0">Sign in with a passkey</button>
    <div class="err" id="err"></div>
  </div>
</main>
<script>
  const b64u = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replaceAll("+", "-").replaceAll("/", "_").replace(/=+$/, "");
  const unb64u = (s) => Uint8Array.from(atob(s.replaceAll("-", "+").replaceAll("_", "/")), (c) => c.charCodeAt(0));
  document.getElementById("signin").onclick = async () => {
    const err = document.getElementById("err");
    err.textContent = "";
    try {
      const { challenge, rpId } = await (await fetch("/admin/login/options", { method: "POST" })).json();
      const cred = await navigator.credentials.get({ publicKey: { challenge: unb64u(challenge), rpId, userVerification: "required", timeout: 60000 } });
      const r = cred.response;
      const res = await fetch("/admin/login", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ id: cred.id, clientDataJSON: b64u(r.clientDataJSON), authenticatorData: b64u(r.authenticatorData), signature: b64u(r.signature) }),
      });
      if (!res.ok) throw new Error((await res.json()).error.message);
      location.href = "/admin";
    } catch (e) {
      err.textContent = e.name === "NotAllowedError" ? "Sign-in was cancelled or timed out." : e.message;
    }
  };
</script>
</body>
</html>
