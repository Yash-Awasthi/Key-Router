<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Your gateway key</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f6f4; --card: #fff; --text: #1d1d1b; --muted: #6b6b66; --line: #e2e2dc; --accent: #2f5bea; --danger: #c43c2b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --card: #1f1f1d; --text: #ececE8; --muted: #9a9a93; --line: #33332f; --accent: #7d9bff; --danger: #ff7a68; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 4px; }
  input { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
  button { margin-top: 16px; padding: 9px 16px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  button.copy { background: none; color: var(--accent); margin: 0 0 0 6px; padding: 0 4px; }
  .err { color: var(--danger); margin-top: 12px; }
  .row { display: flex; align-items: baseline; gap: 4px; margin: 6px 0; }
  .row > span { white-space: nowrap; color: var(--muted); }
  .row code { overflow-wrap: anywhere; }
  code { font: 13px ui-monospace, monospace; }
  pre { margin: 6px 0 0; padding: 10px; border-radius: 6px; background: var(--bg); overflow-x: auto; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 16px 0 0; }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }
  .bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin-top: 4px; }
  .bar > div { height: 100%; background: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Your gateway key</h1>
  <p class="sub">This link works once. Reveal the key only when you are ready to save it.</p>
  <div class="card">
    <button id="reveal" style="margin: 0">Reveal key</button>
    <div class="err" id="err"></div>
    <div id="out" hidden>
      <div class="row"><span>Endpoint:</span> <code id="endpoint"></code><button class="copy" data-copy="endpoint">copy</button></div>
      <div class="row"><span>API key:</span> <code id="key"></code><button class="copy" data-copy="key">copy</button></div>
      <div class="row"><span>Expires:</span> <span id="expires" style="color: inherit"></span></div>
      <div class="row" id="modelsRow"><span>Models:</span> <code id="models"></code></div>
      <div class="row"><span>Claude Code <code>settings.json</code>:</span><button class="copy" data-copy="settings">copy</button></div>
      <pre><code id="settings"></code></pre>
      <p class="sub" style="margin: 16px 0 0">Check your remaining budget any time at <a id="usage" href="/usage">the usage page</a>. This link no longer works.</p>
    </div>
  </div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  // Revealing is a POST, so link previews in chat apps cannot use up the link.
  $("reveal").onclick = async () => {
    $("reveal").disabled = true;
    const res = await fetch(location.pathname, { method: "POST" });
    const k = await res.json();
    if (!res.ok) {
      $("err").textContent = k.error.message;
      return;
    }
    $("reveal").hidden = true;
    $("endpoint").textContent = k.endpoint;
    $("key").textContent = k.key;
    $("expires").textContent = new Date(k.expires).toLocaleString();
    $("models").textContent = k.models.join(", ");
    $("modelsRow").hidden = !k.models.length;
    $("settings").textContent = JSON.stringify({ env: { ANTHROPIC_API_KEY: k.key, ANTHROPIC_BASE_URL: k.origin, CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1" } }, null, 2);
    $("usage").href = "/usage#" + encodeURIComponent(k.key);
    $("out").hidden = false;
  };

  document.querySelectorAll("[data-copy]").forEach((b) => (b.onclick = async () => {
    await navigator.clipboard.writeText(document.getElementById(b.dataset.copy).textContent);
    b.textContent = "copied";
    setTimeout(() => (b.textContent = "copy"), 1200);
  }));
</script>
</body>
</html>
